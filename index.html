<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soporte IT · Tickets</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Colores de Corporación Tyrsa: naranja #f26522 y gris #62666a. Para cambiar la marca, edita --brand. */
:root{--bg:#f4f4f5;--surface:#fff;--ink:#2b2d30;--muted:#5f6368;--line:#dcdde0;--brand:#f26522;--accent:var(--brand);--accent-ink:#1f2023;
--alta:#b3261e;--media:#8a5a00;--baja:#2f7a4d;--abierto:#c2490c;--proceso:#6d4aa6;--resuelto:#2f7a4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1b1d;--surface:#252629;--ink:#ececee;--muted:#a1a4aa;--line:#3a3c40;--accent:var(--brand);--accent-ink:#1f2023;
--alta:#ff8a76;--media:#f0b44c;--baja:#6fcf94;--abierto:#ff8a4d;--proceso:#b99be6;--resuelto:#6fcf94}}
:root[data-theme="dark"]{--bg:#1a1b1d;--surface:#252629;--ink:#ececee;--muted:#a1a4aa;--line:#3a3c40;--accent:var(--brand);--accent-ink:#1f2023;
--alta:#ff8a76;--media:#f0b44c;--baja:#6fcf94;--abierto:#ff8a4d;--proceso:#b99be6;--resuelto:#6fcf94}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--surface);border-bottom:3px solid var(--accent)}
.marca{display:flex;align-items:center;gap:12px}
.marca img{height:40px;width:auto;display:block;background:#fff;border-radius:6px;padding:4px 8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:18px;padding-bottom:18px;flex-wrap:wrap}
h1{font-size:1.35rem;font-weight:600;margin:0}
header p{margin:0;color:var(--muted);font-size:.95rem}
main{padding-top:24px;padding-bottom:40px}
.panel+.panel{margin-top:20px}
body[data-view="publico"] main.wrap{max-width:600px}
body[data-view="publico"] #vTec,body[data-view="tecnicos"] #vPub{display:none}
.confirm{margin-top:14px;font-weight:500}
.confirm:empty{display:none}
.resultado{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.resultado:empty{display:none}
.resultado b{font-size:1.1rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
h2{font-size:1.05rem;margin:0 0 14px;font-weight:600}
label{display:block;font-size:.88rem;font-weight:500;margin:0 0 4px}
.field{margin-bottom:14px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
textarea{min-height:110px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{color:var(--muted);font-size:.82rem;margin-top:3px}
.err{color:var(--alta);font-size:.82rem;margin-top:3px;min-height:1em}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;width:100%;padding:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:1.4rem;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input{flex:1 1 180px;width:auto}
.toolbar select{width:auto;flex:0 0 auto}
.ticket{border:1px solid var(--line);border-left-width:4px;border-radius:8px;background:var(--surface);padding:14px 16px;margin-bottom:10px}
.ticket.alta{border-left-color:var(--alta)}.ticket.media{border-left-color:var(--media)}.ticket.baja{border-left-color:var(--baja)}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.id{font-weight:600}
.badge{font-size:.8rem;font-weight:600;border:1px solid currentColor;border-radius:99px;padding:1px 9px}
.s-abierto{color:var(--abierto)}.s-proceso{color:var(--proceso)}.s-resuelto{color:var(--resuelto)}
.meta{color:var(--muted);font-size:.85rem;margin:2px 0 8px}
.desc{margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions select{width:auto;padding:5px 8px}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:1px dashed var(--line);border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body data-view="publico">
<header><div class="wrap">
  <div class="marca"><img src="logo.png" alt="Logo de la empresa" onerror="this.remove()"><h1>Soporte IT</h1></div>
  <p>Reporta un problema y consulta el estado de tu ticket.</p>
</div></header>

<main class="wrap">
  <div id="vPub">
  <section class="panel" aria-labelledby="t-nuevo">
    <h2 id="t-nuevo">Crear ticket</h2>
    <div id="form" novalidate>
      <div class="field"><label for="nombre">Nombre</label><input id="nombre" autocomplete="name"><div class="err" id="e-nombre"></div></div>
      <div class="field"><label for="correo">Correo</label><input id="correo" type="email" autocomplete="email"><div class="err" id="e-correo"></div></div>
      <div class="row">
        <div class="field"><label for="categoria">Categoría</label>
          <select id="categoria"><option>Red</option><option>Software</option><option>Hardware</option><option>Accesos y contraseñas</option><option>Correo</option><option>Otro</option></select></div>
        <div class="field"><label for="prioridad">Prioridad</label>
          <select id="prioridad"><option value="baja">Baja</option><option value="media" selected>Media</option><option value="alta">Alta</option></select></div>
      </div>
      <div class="field"><label for="asunto">Asunto</label><input id="asunto" maxlength="90"><div class="err" id="e-asunto"></div></div>
      <div class="field"><label for="desc">Descripción</label><textarea id="desc"></textarea>
        <div class="hint">Incluye qué pasó, cuándo empezó y qué equipo usas.</div><div class="err" id="e-desc"></div></div>
      <button class="primary" id="enviar" type="button">Enviar ticket</button>
      <div class="confirm" id="ok" role="status"></div>
    </div>
  </section>

  <section class="panel" aria-labelledby="t-consulta">
    <h2 id="t-consulta">Consultar un ticket</h2>
    <label for="numero">Número de ticket</label>
    <div class="toolbar" style="margin-bottom:0">
      <input id="numero" inputmode="numeric" placeholder="Por ejemplo, 3">
      <button type="button" id="consultar">Consultar</button>
    </div>
    <div class="resultado" id="resultado" role="status"></div>
  </section>
  </div>

  <section id="vTec" aria-labelledby="t-lista">
    <h2 id="t-lista" style="margin-top:4px">Panel de técnicos <a href="#" style="font-size:.85rem;font-weight:400;margin-left:8px">Volver al portal</a></h2>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input id="buscar" type="search" placeholder="Buscar por asunto, nombre o número" aria-label="Buscar tickets">
      <select id="fEstado" aria-label="Filtrar por estado"><option value="">Todos los estados</option><option value="abierto">Abierto</option><option value="proceso">En proceso</option><option value="resuelto">Resuelto</option></select>
      <select id="fPrio" aria-label="Filtrar por prioridad"><option value="">Toda prioridad</option><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select>
    </div>
    <div id="lista"></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY = "tickets-it-v2";
// URL de la aplicación web de Google Apps Script (ver README). Si queda vacía, el portal funciona en modo local.
const API_URL = "https://script.google.com/macros/s/AKfycby_aGC-z2FTXwM9bh_akDrverncGQzQkbd9qFCH0TSt7Vtbr35hYaa6FnkUMrPl04E/exec";
const ESTADOS = {abierto:"Abierto", proceso:"En proceso", resuelto:"Resuelto"};
const PRIO = {alta:"Alta", media:"Media", baja:"Baja"};
const $ = id => document.getElementById(id);

function ejemplo(){
  const h = n => new Date(Date.now() - n*3600e3).toISOString();
  return [
    {id:3,nombre:"Marta López",correo:"marta@empresa.com",categoria:"Accesos y contraseñas",prioridad:"alta",asunto:"No puedo entrar al sistema de facturación",desc:"Después del cambio de contraseña me aparece «usuario bloqueado».",estado:"abierto",fecha:h(2)},
    {id:2,nombre:"Carlos Pérez",correo:"carlos@empresa.com",categoria:"Red",prioridad:"media",asunto:"WiFi intermitente en la sala 2",desc:"Se corta cada 10 minutos durante las reuniones.",estado:"proceso",fecha:h(26)},
    {id:1,nombre:"Ana Ruiz",correo:"ana@empresa.com",categoria:"Hardware",prioridad:"baja",asunto:"Solicitud de segundo monitor",desc:"Necesito un monitor adicional para el puesto 14.",estado:"resuelto",fecha:h(70)}
  ];
}
let tickets = [];
try { const raw = localStorage.getItem(KEY); tickets = raw ? JSON.parse(raw) : ejemplo(); } catch(e){ tickets = ejemplo(); }
function guardar(){ try { localStorage.setItem(KEY, JSON.stringify(tickets)); } catch(e){} }

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(iso){ return new Date(iso).toLocaleString("es", {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }
function aviso(t){ const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(aviso.t); aviso.t = setTimeout(() => el.classList.remove("on"), 2200); }

function render(){
  if (API_URL){
    $("stats").innerHTML = "";
    $("lista").innerHTML = '<div class="empty">Los tickets se guardan en tu hoja de Google Sheets. Gestiona los estados directamente en la columna Estado.</div>';
    return;
  }
  const q = $("buscar").value.trim().toLowerCase(), fe = $("fEstado").value, fp = $("fPrio").value;
  const cuenta = k => tickets.filter(t => t.estado === k).length;
  $("stats").innerHTML = [["Total",tickets.length],["Abiertos",cuenta("abierto")],["En proceso",cuenta("proceso")],["Resueltos",cuenta("resuelto")]]
    .map(([n,v]) => `<div class="stat"><b>${v}</b><span>${n}</span></div>`).join("");
  const vis = tickets.filter(t => (!fe || t.estado === fe) && (!fp || t.prioridad === fp) &&
    (!q || (t.asunto + " " + t.nombre + " #" + t.id).toLowerCase().includes(q)));
  if (!vis.length){
    $("lista").innerHTML = `<div class="empty">${tickets.length ? "Ningún ticket coincide con los filtros." : "Aún no hay tickets. Crea el primero con el formulario."}</div>`;
    return;
  }
  $("lista").innerHTML = vis.map(t => `
    <article class="ticket ${t.prioridad}">
      <div class="top"><span><span class="id">#${t.id}</span> ${esc(t.asunto)}</span><span class="badge s-${t.estado}">${ESTADOS[t.estado]}</span></div>
      <div class="meta">${esc(t.nombre)} · ${esc(t.categoria)} · Prioridad ${PRIO[t.prioridad].toLowerCase()} · ${fmt(t.fecha)}</div>
      <p class="desc">${esc(t.desc)}</p>
      <div class="actions">
        <label for="est-${t.id}" class="meta" style="margin:0">Estado</label>
        <select id="est-${t.id}" data-id="${t.id}" class="cambiar">${Object.entries(ESTADOS).map(([k,v]) => `<option value="${k}"${k===t.estado?" selected":""}>${v}</option>`).join("")}</select>
        <button type="button" data-del="${t.id}">Eliminar</button>
      </div>
    </article>`).join("");
}

function error(campo, msg){ $("e-" + campo).textContent = msg; return !msg; }
async function crearRemoto(v){
  const r = await fetch(API_URL, {method:"POST", body:JSON.stringify(v)});
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || "error");
  return d.id;
}
async function consultarRemoto(n){
  const r = await fetch(API_URL + "?id=" + encodeURIComponent(n));
  return r.json();
}
function claseEstado(txt){
  const t = String(txt).toLowerCase();
  return t.includes("proceso") ? "proceso" : t.includes("resuel") ? "resuelto" : "abierto";
}
async function enviar(){
  const v = {nombre:$("nombre").value.trim(), correo:$("correo").value.trim(), asunto:$("asunto").value.trim(), desc:$("desc").value.trim()};
  let ok = true;
  ok = error("nombre", v.nombre ? "" : "Escribe tu nombre.") && ok;
  ok = error("correo", /^\S+@\S+\.\S+$/.test(v.correo) ? "" : "Escribe un correo válido, por ejemplo nombre@empresa.com.") && ok;
  ok = error("asunto", v.asunto ? "" : "Resume el problema en una línea.") && ok;
  ok = error("desc", v.desc.length >= 10 ? "" : "Describe el problema con al menos 10 caracteres.") && ok;
  if (!ok) return;
  const datos = {...v, categoria:$("categoria").value, prioridad:$("prioridad").value};
  let id;
  if (API_URL){
    const btn = $("enviar");
    btn.disabled = true; btn.textContent = "Enviando…";
    try { id = await crearRemoto(datos); }
    catch(e){ aviso("No se pudo enviar el ticket. Inténtalo de nuevo."); return; }
    finally { btn.disabled = false; btn.textContent = "Enviar ticket"; }
  } else {
    id = tickets.reduce((m,t) => Math.max(m,t.id), 0) + 1;
    tickets.unshift({id, ...datos, estado:"abierto", fecha:new Date().toISOString()});
    guardar();
    render();
  }
  ["asunto","desc"].forEach(i => $(i).value = "");
  aviso("Ticket #" + id + " enviado");
  $("ok").textContent = "Tu número de ticket es #" + id + ". Guárdalo para consultar el estado.";
}

$("enviar").addEventListener("click", enviar);
["buscar","fEstado","fPrio"].forEach(i => $(i).addEventListener("input", render));
$("lista").addEventListener("change", e => {
  if (!e.target.classList.contains("cambiar")) return;
  const t = tickets.find(x => x.id == e.target.dataset.id);
  if (t){ t.estado = e.target.value; guardar(); render(); aviso("Ticket #" + t.id + " pasó a " + ESTADOS[t.estado].toLowerCase()); }
});
$("lista").addEventListener("click", e => {
  const id = e.target.dataset && e.target.dataset.del;
  if (id && confirm("¿Eliminar el ticket #" + id + "?")){ tickets = tickets.filter(t => t.id != id); guardar(); render(); aviso("Ticket eliminado"); }
});
async function consultar(){
  const n = parseInt($("numero").value.replace(/\D/g, ""), 10);
  const r = $("resultado");
  r.innerHTML = "";
  if (!n){ r.textContent = "Escribe el número de tu ticket."; return; }
  let est = null;
  if (API_URL){
    r.textContent = "Consultando…";
    try { const d = await consultarRemoto(n); if (d.ok) est = {txt:d.estado, cls:claseEstado(d.estado)}; }
    catch(e){ r.textContent = "No se pudo consultar. Inténtalo de nuevo."; return; }
  } else {
    const t = tickets.find(x => x.id === n);
    if (t) est = {txt:ESTADOS[t.estado], cls:t.estado};
  }
  if (!est){ r.textContent = "No encontramos el ticket #" + n + ". Revisa el número e inténtalo de nuevo."; return; }
  r.innerHTML = `<b>Ticket #${n}</b><br>Estado: <span class="badge s-${est.cls}">${esc(est.txt)}</span>`;
}
$("consultar").addEventListener("click", consultar);
$("numero").addEventListener("keydown", e => { if (e.key === "Enter") consultar(); });
function vista(){ document.body.dataset.view = location.hash === "#tecnicos" ? "tecnicos" : "publico"; }
window.addEventListener("hashchange", vista);
vista();
render();
</script>
</body>
</html>

</html>
